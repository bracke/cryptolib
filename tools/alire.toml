name = "cryptolib_tools"
description = "Release and verification tooling for the cryptolib crate"
version = "0.1.0-dev"

authors = ["Bent Bracke"]
maintainers = ["Bent Bracke <bent@bracke.dk>"]
maintainers-logins = ["bracke"]
licenses = "MIT OR Apache-2.0 WITH LLVM-exception"
website = ""
tags = []

executables = [
   "check_release_ready",
   "check_alire_manifest",
   "check_test_suite",
   "check_gnatdoc_tags",
]

[[depends-on]]
cryptolib = "*"

[[depends-on]]
project_tools = "~0.1.0"

[[depends-on]]
gnat_native = "^15"

# Local development overrides; dev-only, not for publication.
[[pins]]
cryptolib = { path = ".." }

[[pins]]
project_tools = { path = "../../project_tools" }

# Build dependencies in the development profile (-Og) too, not the default
# release (-O3), so this root and the parent share cryptolib object files
# rather than forcing each other into full rebuilds.
[build-profiles]
"*" = "development"
