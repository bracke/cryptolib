name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Linux build and tests
    runs-on: ubuntu-latest
    env:
      ALIRE_NONINTERACTIVE: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: cryptolib

      # The tools crate pins project_tools by path at ../../project_tools,
      # relative to cryptolib/tools. Checking it out beside this repo is what
      # lets CI run the same preflight a release runs, rather than a subset.
      - name: Checkout project_tools beside it
        uses: actions/checkout@v7
        with:
          repository: bracke/project_tools
          path: project_tools

      - name: Set up Alire
        # Pin the toolchain the manifest requires. setup-alire@v5 defaults to alr
        # 2.1.0, whose index carries gnat_native 15.2.1; v4 pins alr 2.0.2, whose
        # older index cannot resolve it.
        uses: alire-project/setup-alire@v6
        with:
          toolchain: gnat_native=15.2.1 gprbuild

      - name: Raise Alire solver timeout so slow runners get a complete solution
        # Default solver.timeout is 5 s (+10 s grace); a large graph on a slow
        # runner can time out and ship an INCOMPLETE solution, silently dropping
        # transitive crates (then gprbuild fails with "<x>.gpr not found"). Give
        # the solver room to return the complete solution it finds elsewhere.
        shell: bash
        run: alr settings --global --set solver.timeout 600

      - name: Install workflow dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libaunit-dev \
            || sudo apt-get install -y libaunit22-dev \
            || sudo apt-get install -y libaunit24-dev

      - name: Build the library
        working-directory: cryptolib
        run: |
          alr --non-interactive update
          alr --non-interactive build

      # `alr update` first, and it is not optional on a fresh checkout: tests/
      # pins cryptolib by path, alire/ is generated and untracked, and `alr
      # build` alone regenerates the directory without resolving the pin --
      # gprbuild then fails with `imported project file "cryptolib.gpr" not
      # found`. Same for tools/ below.
      - name: Build and run the test suite
        working-directory: cryptolib/tests
        run: |
          alr --non-interactive update
          alr --non-interactive build
          ./bin/tests

      # The preflight is the gate a release goes through: the constant-time
      # budgets, the other platform's backend, the Alire manifest, the test
      # suite's own shape, the README examples, and the GNATdoc tags. CI used
      # to run two of those ten steps -- a build and the suite -- so six checks
      # existed only when somebody ran them by hand, including the compile
      # check for the Windows RNG that nothing else covers on Linux.
      - name: Build the tools crate
        working-directory: cryptolib/tools
        run: |
          alr --non-interactive update
          alr --non-interactive build

      - name: Run the release preflight
        working-directory: cryptolib
        run: ./tools/bin/check_release_ready
