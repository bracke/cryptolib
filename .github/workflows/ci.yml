name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Linux build and tests
    runs-on: ubuntu-latest
    env:
      ALIRE_NONINTERACTIVE: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: cryptolib

      # The tools crate pins project_tools by path at ../../project_tools,
      # relative to cryptolib/tools. Checking it out beside this repo is what
      # lets CI run the same preflight a release runs, rather than a subset.
      - name: Checkout project_tools beside it
        uses: actions/checkout@v7
        with:
          repository: bracke/project_tools
          path: project_tools

      - name: Set up Alire
        # Pin the toolchain the manifest requires. setup-alire@v5 defaults to alr
        # 2.1.0, whose index carries gnat_native 15.2.1; v4 pins alr 2.0.2, whose
        # older index cannot resolve it.
        uses: alire-project/setup-alire@v6
        with:
          toolchain: gnat_native=15.2.1 gprbuild

      - name: Raise Alire solver timeout so slow runners get a complete solution
        # Default solver.timeout is 5 s (+10 s grace); a large graph on a slow
        # runner can time out and ship an INCOMPLETE solution, silently dropping
        # transitive crates (then gprbuild fails with "<x>.gpr not found"). Give
        # the solver room to return the complete solution it finds elsewhere.
        shell: bash
        run: alr settings --global --set solver.timeout 600

      - name: Install workflow dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libaunit-dev \
            || sudo apt-get install -y libaunit22-dev \
            || sudo apt-get install -y libaunit24-dev

      - name: Build the library
        working-directory: cryptolib
        run: |
          alr --non-interactive update
          alr --non-interactive build

      # `alr update` first, and it is not optional on a fresh checkout: tests/
      # pins cryptolib by path, alire/ is generated and untracked, and `alr
      # build` alone regenerates the directory without resolving the pin --
      # gprbuild then fails with `imported project file "cryptolib.gpr" not
      # found`. Same for tools/ below.
      - name: Build and run the test suite
        working-directory: cryptolib/tests
        run: |
          alr --non-interactive update
          alr --non-interactive build
          ./bin/tests

      # The preflight is the gate a release goes through: the constant-time
      # budgets, the other platform's backend, the Alire manifest, the test
      # suite's own shape, the README examples, and the GNATdoc tags. CI used
      # to run two of those ten steps -- a build and the suite -- so six checks
      # existed only when somebody ran them by hand, including the compile
      # check for the Windows RNG that nothing else covers on Linux.
      - name: Build the tools crate
        working-directory: cryptolib/tools
        run: |
          alr --non-interactive update
          alr --non-interactive build

      - name: Run the release preflight
        working-directory: cryptolib
        run: ./tools/bin/check_release_ready

  # Windows only, and macOS is absent for a reason worth writing down rather
  # than rediscovering. The Alire index has no Apple Silicon GNAT 15: version
  # 15.2.1 carries a macOS x86_64 origin and no aarch64-darwin one, so
  # macos-latest cannot resolve the toolchain this crate requires (^15) and
  # fails in `alr toolchain --select`. 14.2.1 does have an aarch64-darwin
  # build, but the crate does not accept 14. The Intel images that could run
  # 15.2.1 are retired and no longer allocate. So macOS coverage here waits on
  # an Apple Silicon GNAT 15 appearing in the index; until then src-macos gets
  # the semantic compile the Linux preflight runs, and nothing more.
  #
  # The preflight deliberately stays on Linux: its
  # constant-time step disassembles the archive with objdump and matches ELF
  # symbol names, which is not a portable question. What these jobs answer is
  # the one nothing else could -- whether the per-OS entropy backend compiles,
  # links and *runs* on its own platform. src-windows/cryptolib-os_random.adb
  # calls BCryptGenRandom and, until this job existed, had never been executed
  # anywhere; the Linux preflight only semantically compiles it.
  portable:
    name: ${{ matrix.os }} build and RNG
    runs-on: ${{ matrix.os }}
    # A runner label nothing can satisfy queues until the six-hour default
    # rather than failing, and a job that never finishes leaves the whole run
    # unfinished. That happened here: seven pushes sat "queued" for hours
    # apiece behind a macOS job no runner would take. Fail in minutes instead.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            exe: ".exe"
    env:
      ALIRE_NONINTERACTIVE: "true"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Alire
        uses: alire-project/setup-alire@v6
        with:
          toolchain: gnat_native=15.2.1 gprbuild

      - name: Raise Alire solver timeout so slow runners get a complete solution
        run: alr settings --global --set solver.timeout 600

      # This is the real per-OS build: Source_Dirs picks src-macos or
      # src-windows by host, so the backend compiled here is the one this
      # platform ships, not the semantic check the Linux job runs.
      - name: Build the library
        run: |
          alr --non-interactive update
          alr --non-interactive build

      # The examples link nothing but cryptolib -- no OpenSSL -- so they are
      # what can be run on a platform where the test suite cannot yet link.
      - name: Build the examples
        run: alr exec -- gprbuild -q -f -P examples/examples.gpr

      # Run the entropy source for real. Checked by output, not exit status:
      # example_random prints "no entropy source available" and returns
      # normally when Fill fails, so trusting its exit code would pass a job
      # in which the RNG delivered nothing -- exactly the failure this job
      # exists to catch.
      # `tr -d '\r'` because GNAT's Text_IO writes CRLF on Windows and `$(...)`
      # strips only the trailing newline, so the comparison would fail on the
      # carriage return alone and report a broken RNG that was fine.
      - name: Draw from the OS entropy source
        run: |
          out=$(./examples/bin/example_random${{ matrix.exe }} | tr -d '\r')
          echo "$out"
          test "$out" = "drew 32 bytes"

      - name: Smoke the primitives
        run: |
          ./examples/bin/example_hashes${{ matrix.exe }}
          ./examples/bin/example_secure_wipe${{ matrix.exe }}
          ./examples/bin/example_macs${{ matrix.exe }}

